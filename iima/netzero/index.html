<html lang="en">
<head>
    <meta charset="UTF-8">

     <title>NetZero | Minimalist Aesthetic Snake Game</title>
    <meta name="title" content="NetZero | Minimalist Aesthetic Snake Game">
<meta name="description" content="A cute, meditative reverse snake game about reaching Net Zero. Eat to shrink your footprint, dodge distractions, and disappear in this minimalist HTML5 experience. Designed by Dilip Yadav.">
<meta name="keywords" content="NetZero, reverse snake, sustainability game, MBA game, cute html games, minimalist game, zen snake, web game, Dilip Yadav">

<meta property="og:type" content="website">
<meta property="og:url" content="https://dilipyadav.me/netzero">
<meta property="og:title" content="NetZero | The Aesthetic Reverse Snake Game">
<meta property="og:description" content="A meditative twist on the classic snake. Reduce your footprint, avoid distractions, and reach net zero.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NetZero",
      "operatingSystem": "Web",
      "applicationCategory": "GameApplication",
      "author": { "@type": "Person", "name": "Dilip Yadav", "url": "https://dilipyadav.me" }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        html, body { height: 100%; }
        body {
            background-color: #f7f7f5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            margin: 0;
        }

        .btn-juicy {
            position: relative;
            width: 10rem; height: 5rem;
            background: #A776F5;
            border-radius: 1.2rem;
            transition: all 0.15s ease-out;
            cursor: pointer;
        }
        .btn-juicy::before {
            content: ''; position: absolute; border-radius: 1.2rem;
            background: #4B25B2; width: 10rem; height: 5rem;
            left: 0; top: 0.6rem; z-index: -1;
        }
        .btn-juicy-top {
            position: absolute; inset: 0;
            background: #FFB20F;
            border: 3px solid #CB6329;
            border-radius: 1rem;
            display: flex; justify-content: center; align-items: center;
            top: 0;
            transition: all 0.1s ease-out;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.4);
        }
        .btn-juicy:hover .btn-juicy-top { top: 0.2rem; }
        .btn-juicy:active .btn-juicy-top { top: 0.5rem; }
        .btn-text { font-weight: 900; font-size: 1.8rem; color: white; text-shadow: 0 2px #CB6329; pointer-events: none; }

        #frame {
            position: fixed;
            inset: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
            border: 12px solid #041661;
            border-radius: 24px;
            background: transparent;
            z-index: 10;
            pointer-events: none;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        #timer-ui {
            position: fixed;
            top: calc(50px + env(safe-area-inset-top));
            z-index: 100;
            font-weight: 900;
            font-size: 2.5rem;
            color: #041661;
            opacity: 0.15;
            letter-spacing: -1px;
            pointer-events: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(247, 247, 245, 0.95);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .footer {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #041661;
            opacity: 0.4;
            text-align: center;
            padding: 0 20px;
        }
        .footer a { text-decoration: underline; font-weight: 900; }
        .hidden { display: none; }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 250;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="timer-ui">00:00</div>
    <div id="frame"></div>

    <div id="start-modal" class="modal">
        <h1 class="text-5xl md:text-7xl font-black text-[#041661] mb-2 tracking-tighter">NETZERO</h1>
        <p class="text-[10px] md:text-sm uppercase tracking-[0.4em] text-[#A776F5] mb-12 text-center px-6">Less is more. Reach zero.</p>
        <div class="btn-juicy" onclick="initGame('start')">
            <div class="btn-juicy-top"><span class="btn-text">PLAY</span></div>
        </div>
        <div class="footer">
            Designed by <a href="https://dilipyadav.me" target="_blank">Dilip Yadav</a> • Vibe Coded on <span class="font-bold">Google Gemini</span>
        </div>
    </div>

    <div id="status-modal" class="modal hidden">
        <h1 id="status-title" class="text-5xl md:text-6xl font-black text-[#041661] mb-4">WHOOPS.</h1>
        <p id="status-quote" class="text-sm md:text-lg text-[#4B25B2] mb-8 italic px-10 text-center max-w-md"></p>
        <div id="stats-box" class="mb-8 text-center">
            <div class="text-gray-400 uppercase text-[10px] tracking-widest mb-1">Time Lived</div>
            <div id="final-time" class="text-4xl font-black text-[#041661]">00:00</div>
        </div>
        <div class="btn-juicy" onclick="initGame('over')">
            <div class="btn-juicy-top"><span class="btn-text">RETRY</span></div>
        </div>
        <div class="footer">
            Designed by <a href="https://dilipyadav.me" target="_blank">Dilip Yadav</a> • Vibe Coded on <span class="font-bold">Google Gemini</span>
        </div>
    </div>

    <canvas id="game"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const frameEl = document.getElementById('frame');
        const ctx = canvas.getContext('2d');
        const timerUI = document.getElementById('timer-ui');
        const startModal = document.getElementById('start-modal');
        const statusModal = document.getElementById('status-modal');
        const statusTitle = document.getElementById('status-title');
        const statusQuote = document.getElementById('status-quote');
        const finalTimeDisplay = document.getElementById('final-time');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');

        let GRID_SIZE, TILE_X, TILE_Y;
        let playArea = { left: 0, top: 0, width: 0, height: 0 };
        let snake = [], food = {}, dir = {x:1, y:0}, nextDir = {x:1, y:0};
        let lastTime = 0, startTime = 0, gameActive = false;
        let moveInterval = 185; 
        let tStartX = 0, tStartY = 0;
        let distraction = null, nextDistractionAt = 0, distractionTimeout = null;

        const distractionEmojis = ['📱', '🎮', '📺', '🛏️', '☕', '🎧'];
        const distractionEndQuotes = [
            "Scrolled Instagram instead of prepping your case. Rookie mistake.",
            "Professor cold-called you. You were mid-scroll.",
            "That notification just cost you the term.",
            "Attendance: 0%. Focus: also 0%.",
            "You opened 'just one tab' and lost the plot entirely.",
            "Placement prep can wait, right? Wrong.",
            "Mid-term energy, but make it doomscrolling.",
            "Your CGPA just took an unscheduled sabbatical."
        ];

        const failQuotes = [
            "Your unit economics never made sense. Neither did that turn.",
            "Pivoted straight into a wall. The board is not impressed.",
            "Rejected. Add it to the pile with your consulting applications.",
            "Case closed — you failed to identify the wall as a stakeholder.",
            "Your growth strategy hit a hard stop. Literally.",
            "Due diligence would've caught that wall.",
            "Great pitch, zero execution.",
            "That's not a pivot, that's a failure to read the room.",
            "Synergy achieved: zero. Growth achieved: also zero.",
            "Your CV just got a rejection email from itself.",
            "Strategy meeting called. Verdict: you crashed the KPIs.",
            "Bold move. Zero ROI. Classic."
        ];

        const winQuotes = [
            "Fully diluted in [TIME]. Total exit achieved.",
            "Zero headcount. [TIME] well spent optimizing yourself away.",
            "You are now officially 'Pre-Revenue'. Congratulations?",
            "It took [TIME] to achieve perfect operational efficiency.",
            "You've exited the cap table. [TIME] later, acquisition complete.",
            "Case closed in [TIME]. Textbook synergy realization.",
            "Valuation: zero. Efficiency: 100%. [TIME] well invested.",
            "Achieved maximum lean startup in [TIME]. Almost too lean.",
            "You've successfully downsized to nothing in [TIME].",
            "ESG report done — you personally hit net zero in [TIME].",
            "Runway fully extended by disappearing in [TIME].",
            "Balance sheet cleared in [TIME]. Nothing left to liquidate."
        ];

        // Preload the book food icon. If bookicon.svg is missing or fails to
        // load, drawFoodIcon() below falls back to a hand-drawn yellow book
        // (mimicking a Font Awesome fa-book glyph) so the food never disappears.
        const bookIcon = new Image();
        let bookIconReady = false;
        bookIcon.onload = () => { bookIconReady = true; };
        bookIcon.onerror = () => { bookIconReady = false; };
        bookIcon.src = 'bookicon.svg';

        function drawFoodIcon(cx, cy) {
            if (bookIconReady) {
                const size = GRID_SIZE * 0.82;
                ctx.drawImage(bookIcon, cx - size / 2, cy - size / 2, size, size);
            } else {
                drawBookIconFallback(cx, cy);
            }
        }

        function drawBookIconFallback(cx, cy) {
            const w = GRID_SIZE * 0.78, h = GRID_SIZE * 0.62;
            const left = cx - w / 2, top = cy - h / 2;
            ctx.save();
            ctx.fillStyle = "#FFB20F";
            ctx.strokeStyle = "#CB6329";
            ctx.lineWidth = Math.max(1, GRID_SIZE * 0.06);
            ctx.lineJoin = "round";

            // Left page
            ctx.beginPath();
            ctx.moveTo(cx, top + h * 0.14);
            ctx.quadraticCurveTo(left, top, left, top + h * 0.14);
            ctx.lineTo(left, top + h * 0.86);
            ctx.quadraticCurveTo(left, top + h, cx, top + h * 0.86);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Right page
            const right = cx + w / 2;
            ctx.beginPath();
            ctx.moveTo(cx, top + h * 0.14);
            ctx.quadraticCurveTo(right, top, right, top + h * 0.14);
            ctx.lineTo(right, top + h * 0.86);
            ctx.quadraticCurveTo(right, top + h, cx, top + h * 0.86);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Spine
            ctx.beginPath();
            ctx.moveTo(cx, top + h * 0.14);
            ctx.lineTo(cx, top + h * 0.86);
            ctx.stroke();
            ctx.restore();
        }

        // Preload the white head logo. If it's missing or fails to load, the
        // head simply stays as a plain colored box (see draw()).
        const headLogo = new Image();
        let headLogoReady = false;
        headLogo.onload = () => { headLogoReady = true; };
        headLogo.onerror = () => { headLogoReady = false; };
        headLogo.src = 'iimalogowhite.svg';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if(type === 'eat') {
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (type==='eat'?0.1:0.5));
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + (type==='eat'?0.1:0.5));
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const isMobile = window.innerWidth < 768;
            GRID_SIZE = isMobile ? Math.floor(window.innerWidth / 28) : 35;

            // Measure the actual rendered frame border on screen and fit the
            // grid exactly inside it, so the wall the player sees is always
            // the wall the snake actually collides with.
            const frameBorder = 12; // must match #frame's CSS border-width
            const rect = frameEl.getBoundingClientRect();
            playArea.left = rect.left + frameBorder;
            playArea.top = rect.top + frameBorder;
            playArea.width = rect.width - frameBorder * 2;
            playArea.height = rect.height - frameBorder * 2;

            TILE_X = Math.floor(playArea.width / GRID_SIZE);
            TILE_Y = Math.floor(playArea.height / GRID_SIZE);
        }

        function initGame(source) {
            source === 'start' ? startModal.classList.add('hidden') : statusModal.classList.add('hidden');
            snake = [];
            const midX = Math.floor(TILE_X / 2), midY = Math.floor(TILE_Y / 2);
            for(let i=0; i<20; i++) snake.push({x: midX - i, y: midY});
            dir = {x:1, y:0}; nextDir = {x:1, y:0};
            spawnFood();
            clearTimeout(distractionTimeout);
            distraction = null;
            scheduleNextDistraction();
            startTime = Date.now();
            gameActive = true;
            requestAnimationFrame(loop);
        }

        function spawnFood() {
            food = { x: Math.floor(Math.random()*TILE_X), y: Math.floor(Math.random()*TILE_Y) };
            if(snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
        }

        function scheduleNextDistraction() {
            // Randomly timed: the next distraction shows up somewhere
            // between 3 and 7 seconds from now.
            nextDistractionAt = Date.now() + 3000 + Math.random() * 4000;
        }

        function trySpawnDistraction() {
            if (distraction || !gameActive || Date.now() < nextDistractionAt) return;
            const x = Math.floor(Math.random() * TILE_X), y = Math.floor(Math.random() * TILE_Y);
            // Never overlap the snake or the food.
            if (snake.some(s => s.x === x && s.y === y) || (x === food.x && y === food.y)) return;
            distraction = { x, y, emoji: distractionEmojis[Math.floor(Math.random() * distractionEmojis.length)], spawnTime: Date.now() };
            clearTimeout(distractionTimeout);
            // If it's not eaten in time, it wanders off on its own.
            distractionTimeout = setTimeout(() => {
                distraction = null;
                scheduleNextDistraction();
            }, 6000);
        }

        function clearDistraction() {
            clearTimeout(distractionTimeout);
            distraction = null;
        }

        // --- Confetti ---
        let confettiParticles = [];
        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        function spawnConfetti() {
            resizeConfettiCanvas();
            const colors = ['#FFB20F', '#A776F5', '#4B25B2', '#041661', '#CB6329'];
            confettiParticles = [];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: -20 - Math.random() * confettiCanvas.height * 0.5,
                    w: 6 + Math.random() * 6,
                    h: 8 + Math.random() * 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: 2 + Math.random() * 3,
                    vx: -1.5 + Math.random() * 3,
                    rot: Math.random() * Math.PI * 2,
                    vr: -0.2 + Math.random() * 0.4
                });
            }
            requestAnimationFrame(confettiLoop);
        }
        function confettiLoop() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let stillFalling = false;
            confettiParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                if (p.y < confettiCanvas.height + 20) stillFalling = true;
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rot);
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                confettiCtx.restore();
            });
            if (stillFalling) {
                requestAnimationFrame(confettiLoop);
            } else {
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        window.addEventListener('keydown', e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
            if(e.key === 'ArrowUp' && dir.y === 0) nextDir = {x:0, y:-1};
            if(e.key === 'ArrowDown' && dir.y === 0) nextDir = {x:0, y:1};
            if(e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1, y:0};
            if(e.key === 'ArrowRight' && dir.x === 0) nextDir = {x:1, y:0};
        });

        canvas.addEventListener('touchstart', e => { tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY; }, {passive: false});
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tStartX, dy = e.changedTouches[0].clientY - tStartY;
            if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > 30) nextDir = dx > 0 ? (dir.x===0?{x:1,y:0}:nextDir) : (dir.x===0?{x:-1,y:0}:nextDir); }
            else { if (Math.abs(dy) > 30) nextDir = dy > 0 ? (dir.y===0?{x:0,y:1}:nextDir) : (dir.y===0?{x:0,y:-1}:nextDir); }
        }, {passive: false});

        function update() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            if(head.x < 0 || head.x >= TILE_X || head.y < 0 || head.y >= TILE_Y || snake.some(s => s.x === head.x && s.y === head.y)) {
                showStatus('fail'); return;
            }
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                playSfx('eat');
                if (navigator.vibrate) navigator.vibrate(15);
                for(let i=0; i<3; i++) if(snake.length > 1) snake.pop();
                if(snake.length <= 1) showStatus('win');
                else spawnFood();
            } else if (distraction && head.x === distraction.x && head.y === distraction.y) {
                clearDistraction();
                showStatus('distracted');
                return;
            } else { snake.pop(); }
            trySpawnDistraction();
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timerUI.innerText = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
        }

        function showStatus(mode) {
            gameActive = false;
            const t = timerUI.innerText;
            finalTimeDisplay.innerText = t;
            if(mode === 'win') {
                statusTitle.innerText = "NET ZERO."; statusTitle.style.color = "#FFB20F";
                statusQuote.innerText = winQuotes[Math.floor(Math.random()*winQuotes.length)].replace("[TIME]", t);
                spawnConfetti();
            } else if (mode === 'distracted') {
                statusTitle.innerText = "DISTRACTED."; statusTitle.style.color = "#CB6329";
                statusQuote.innerText = distractionEndQuotes[Math.floor(Math.random()*distractionEndQuotes.length)].replace("[TIME]", t);
                playSfx('die');
                if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
            } else {
                statusTitle.innerText = "WHOOPS."; statusTitle.style.color = "#041661";
                statusQuote.innerText = failQuotes[Math.floor(Math.random()*failQuotes.length)].replace("[TIME]", t);
                playSfx('die');
                if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
            }
            statusModal.classList.remove('hidden');
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const ox = playArea.left, oy = playArea.top;
            const fx = food.x * GRID_SIZE + GRID_SIZE/2 + ox, fy = food.y * GRID_SIZE + GRID_SIZE/2 + oy;
            drawFoodIcon(fx, fy);

            if (distraction) {
                const boxX = distraction.x * GRID_SIZE + ox + 2, boxY = distraction.y * GRID_SIZE + oy + 2, boxSize = GRID_SIZE - 4;
                const dx = boxX + boxSize / 2, dy = boxY + boxSize / 2;
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxSize, boxSize, GRID_SIZE / 4);
                ctx.fillStyle = "#F3EEFB";
                ctx.fill();
                ctx.lineWidth = Math.max(1, GRID_SIZE * 0.06);
                ctx.strokeStyle = "#A776F5";
                ctx.stroke();
                ctx.font = `${GRID_SIZE * 0.7}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(distraction.emoji, dx, dy + GRID_SIZE * 0.03);
                ctx.restore();
            }

            snake.forEach((s, i) => {
                const boxX = s.x * GRID_SIZE + ox + 2, boxY = s.y * GRID_SIZE + oy + 2, boxSize = GRID_SIZE - 4;
                ctx.fillStyle = i === 0 ? "#4B25B2" : `rgba(167, 118, 245, ${1 - (i/snake.length)})`;
                ctx.beginPath();
                // Using Proportional Radius (GRID_SIZE / 4) for "Pebble" look
                ctx.roundRect(boxX, boxY, boxSize, boxSize, GRID_SIZE / 4);
                ctx.fill();

                // First box (the head): place the white logo on top, fit exactly
                // to the box. If the logo never loaded, the box above remains
                // exactly as it was, so nothing breaks.
                if (i === 0 && headLogoReady) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, boxSize, boxSize, GRID_SIZE / 4);
                    ctx.clip();
                    const pad = boxSize * 0.16;
                    ctx.drawImage(headLogo, boxX + pad, boxY + pad, boxSize - pad * 2, boxSize - pad * 2);
                    ctx.restore();
                }
            });
        }

        function loop(t) {
            if(!gameActive) return;
            if(t - lastTime > moveInterval) { update(); lastTime = t; }
            draw(); requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
