<style>
  :root{
    --indigo: #1B1A47;
    --pink: #FC1F8F;
    --bg: #FFFBFD;
    --muted: #6f6d90;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .stage{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    width: 100%;
    padding: 4vh 6vw;
    text-align: center;
    overflow: hidden;
  }

  /* ---------- Layer 0: scattered background shapes (parallax only) ---------- */

  .deco{
    position: absolute;
    pointer-events: none;
    opacity: 0;
    animation: decoFade 1s ease-out forwards;
  }
  .deco svg{ display: block; width: 100%; height: 100%; }

  .deco-star{
    top: 12%;
    left: 9%;
    width: clamp(26px, 4.5vw, 46px);
    height: clamp(26px, 4.5vw, 46px);
    animation-delay: 0.1s;
  }
  .deco-scribble{
    bottom: 14%;
    left: 7%;
    width: clamp(50px, 8vw, 90px);
    height: clamp(24px, 4vw, 40px);
    animation-delay: 0.25s;
  }
  .deco-blob{
    top: 16%;
    right: 10%;
    width: clamp(20px, 3.6vw, 34px);
    height: clamp(20px, 3.6vw, 34px);
    animation-delay: 0.4s;
  }

  @keyframes decoFade{
    from{ opacity: 0; transform: scale(0.7); }
    to  { opacity: 1; transform: scale(1); }
  }

  /* ---------- Layer 1: parallax wrappers (JS translate only) ---------- */

  .parallax{
    will-change: transform;
  }

  /* ---------- Layer 2: mascot (float animation + static tilt) ---------- */

  .mascot-float{
    animation: float 5.5s ease-in-out infinite;
  }

  .mascot-wrap{
    position: relative;
    width: clamp(160px, 25vw, 300px);
    margin-bottom: clamp(10px, 2vh, 20px);
    transform: rotate(-3deg);
  }

  svg#mascot{
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 20px 34px rgba(27, 26, 71, 0.14));
  }

  @keyframes float{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .badge{
    position: absolute;
    top: -4%;
    right: -14%;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(1.1rem, 3.2vw, 1.6rem);
    color: var(--pink);
    transform: rotate(9deg);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    animation: badgePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 0.35s;
  }

  @keyframes badgePop{
    from { opacity: 0; transform: rotate(9deg) scale(0.4); }
    to   { opacity: 1; transform: rotate(9deg) scale(1); }
  }

  /* ---------- Layer 2/3: text (static collage offsets + staggered entrance) ---------- */

  .text-block{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .headline-stack{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.02em;
  }

  .line{
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 0.98;
    margin: 0;
    opacity: 0;
    animation: lineIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .line-1{
    font-size: clamp(1.6rem, 6.2vw, 2.9rem);
    color: var(--indigo);
    --rot: -3deg;
    --shift: -5%;
    animation-delay: 0.45s;
  }

  .line-2{
    position: relative;
    display: inline-block;
    font-size: clamp(2rem, 8vw, 3.8rem);
    color: var(--pink);
    margin-top: 0.1em;
    padding-bottom: 0.16em;
    --rot: 3deg;
    --shift: 4%;
    animation-delay: 0.6s;
  }

  @keyframes lineIn{
    from { opacity: 0; transform: translateY(22px) translateX(var(--shift)) rotate(var(--rot)) scale(0.9); }
    to   { opacity: 1; transform: translateY(0)     translateX(var(--shift)) rotate(var(--rot)) scale(1); }
  }

  .squiggle{
    position: absolute;
    left: 4%;
    bottom: 0;
    width: 92%;
    height: auto;
  }

  .loading-dots span{
    display: inline-block;
    animation: pulseDot 1.4s infinite;
  }
  .loading-dots span:nth-child(2){ animation-delay: 0.2s; }
  .loading-dots span:nth-child(3){ animation-delay: 0.4s; }

  @keyframes pulseDot{
    0%, 80%, 100% { opacity: 0.15; }
    40%           { opacity: 1; }
  }

  .subtext{
    margin: clamp(14px, 3vh, 22px) 0 0;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: clamp(0.8rem, 1.8vw, 0.95rem);
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-3%);
    animation: subIn 0.6s ease-out forwards;
    animation-delay: 0.8s;
  }
  .subtext .dot{ color: var(--pink); margin: 0 0.6ch; }

  @keyframes subIn{
    from { opacity: 0; transform: translateX(-3%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-3%) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .mascot-float{ animation: none; }
    .deco, .badge, .line, .subtext{ animation: none; opacity: 1; }
    .loading-dots span{ animation: none; opacity: 1; }
    .pupil{ transition: none; }
    .parallax{ transform: none !important; }
  }

  @media (max-height: 420px){
    .mascot-wrap{ margin-bottom: 8px; }
    svg#mascot{ width: clamp(100px, 16vw, 190px); }
    .subtext{ margin-top: 8px; }
  }
</style>

<script>
  (function(){
    var svg = document.getElementById('mascot');
    var pupils = document.querySelectorAll('.pupil');
    var travel = 9; // how far the pupils shift, in the SVG's own coordinate units

    function updatePupils(clientX, clientY){
      var rect = svg.getBoundingClientRect();
      var vb = svg.viewBox.baseVal;
      var scaleX = vb.width / rect.width;
      var scaleY = vb.height / rect.height;
      var px = (clientX - rect.left) * scaleX;
      var py = (clientY - rect.top) * scaleY;

      pupils.forEach(function(pupil){
        var cx = parseFloat(pupil.dataset.cx);
        var cy = parseFloat(pupil.dataset.cy);
        var angle = Math.atan2(py - cy, px - cx);

        var dx = Math.cos(angle) * travel;
        var dy = Math.sin(angle) * travel;

        pupil.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')');
      });
    }

    document.addEventListener('pointermove', function(e){
      updatePupils(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]){
        updatePupils(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
  })();

  // ---- Layered parallax: moves only the outer ".parallax" / ".deco" wrappers ----
  (function(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var layers = Array.prototype.slice.call(document.querySelectorAll('.parallax, .deco'));
    var targets = layers.map(function(el){
      var depth = parseFloat(el.dataset.depth || '0.15');
      return { el: el, depth: depth, curX: 0, curY: 0, goalX: 0, goalY: 0 };
    });

    var maxShiftX = 22; // px, at depth = 1
    var maxShiftY = 14; // px, at depth = 1

    function setGoal(clientX, clientY){
      var nx = (clientX / window.innerWidth - 0.5) * 2;   // -1..1
      var ny = (clientY / window.innerHeight - 0.5) * 2;  // -1..1
      targets.forEach(function(t){
        t.goalX = nx * maxShiftX * t.depth;
        t.goalY = ny * maxShiftY * t.depth;
      });
    }

    function tick(){
      targets.forEach(function(t){
        t.curX += (t.goalX - t.curX) * 0.08;
        t.curY += (t.goalY - t.curY) * 0.08;
        t.el.style.transform = 'translate3d(' + t.curX.toFixed(2) + 'px,' + t.curY.toFixed(2) + 'px,0)';
      });
      requestAnimationFrame(tick);
    }

    document.addEventListener('pointermove', function(e){
      setGoal(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]){
        setGoal(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    requestAnimationFrame(tick);
  })();
</script>
